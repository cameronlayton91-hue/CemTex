name: Update CemTex Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get CemTex code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gather news intelligence
        run: python fetch_news.py

      - name: Save updated intelligence
        run: |
          git config user.name "CemTex Intelligence Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No intelligence changes to save."
          else
            git commit -m "Update CemTex intelligence"
            git push
          fi
