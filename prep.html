<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>CemTex | Private Interview Prep</title>

<link
  rel="stylesheet"
  href="/CemTex/style.css?v=5"
>

<style>

.lock-wrap {
  min-height: 70vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

.lock-card {
  width: 100%;
  max-width: 480px;

  background:
    linear-gradient(
      145deg,
      #111827,
      #172033
    );

  border: 1px solid #263449;
  border-radius: 16px;

  padding: 32px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);
}

.lock-icon {
  font-size: 34px;

  margin-bottom: 14px;
}

.lock-card h1 {
  margin:
    0 0 8px;

  font-size: 28px;
}

.lock-card p {
  color: #94a3b8;

  line-height: 1.6;

  font-size: 13px;
}

.password-input {
  width: 100%;

  margin-top: 14px;

  padding: 14px;

  background: #080d16;

  border: 1px solid #334155;
  border-radius: 8px;

  color: white;

  font-size: 15px;
}

.unlock-button {
  width: 100%;

  margin-top: 10px;

  padding: 13px;

  background: #2563eb;

  color: white;

  border: none;
  border-radius: 8px;

  font-weight: 750;

  cursor: pointer;
}

.unlock-button:hover {
  background: #1d4ed8;
}

.lock-error {
  min-height: 20px;

  margin-top: 12px;

  color: #fca5a5;

  font-size: 12px;
}

.private-content {
  display: none;

  margin-top: 28px;
}

.private-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 15px;

  margin-bottom: 20px;
}

.logout-button {
  background: #263449;

  color: white;

  border: none;
  border-radius: 7px;

  padding: 9px 12px;

  cursor: pointer;
}

#decryptedContent {
  color: #d5dce7;

  line-height: 1.6;
}

</style>

</head>


<body>


<header class="topbar">

  <div class="topbar-inner">

    <div>

      <div class="brand">
        CemTex Intelligence
      </div>

      <div class="tagline">
        Market Intelligence & Sales Opportunity Monitor
      </div>

    </div>


    <nav class="nav">

      <a
        href="index.html"
        class="nav-link"
      >
        Dashboard
      </a>

      <a
        href="strategy.html"
        class="nav-link"
      >
        Strategic Brief
      </a>

      <a
        href="prep.html"
        class="nav-link active"
      >
        🔒 Interview Prep
      </a>

    </nav>

  </div>

</header>



<main class="container">


<section
  id="lockScreen"
  class="lock-wrap"
>

  <div class="lock-card">

    <div class="lock-icon">
      🔒
    </div>

    <div class="eyebrow">
      PRIVATE
    </div>

    <h1>
      Cameron Interview Prep
    </h1>

    <p>
      This section contains encrypted interview notes.
      Enter your password to decrypt them locally
      in this browser.
    </p>


    <input
      id="passwordInput"
      class="password-input"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >


    <button
      id="unlockButton"
      class="unlock-button"
    >
      Unlock Prep
    </button>


    <div
      id="lockError"
      class="lock-error"
    ></div>

  </div>

</section>



<section
  id="privateContent"
  class="private-content"
>

  <div class="private-toolbar">

    <div>

      <div class="eyebrow">
        PRIVATE WORKSPACE
      </div>

      <h1>
        Interview Prep
      </h1>

    </div>


    <button
      id="logoutButton"
      class="logout-button"
    >
      Lock
    </button>

  </div>


  <div id="decryptedContent"></div>

</section>


</main>



<script>

const encoder =
  new TextEncoder();

const decoder =
  new TextDecoder();



function fromBase64(value) {

  const binary =
    atob(value);

  return Uint8Array.from(
    binary,
    char =>
      char.charCodeAt(0)
  );

}



async function deriveKey(
  password,
  salt
) {

  const keyMaterial =
    await crypto.subtle.importKey(

      "raw",

      encoder.encode(password),

      {
        name: "PBKDF2"
      },

      false,

      [
        "deriveKey"
      ]

    );


  return crypto.subtle.deriveKey(

    {
      name: "PBKDF2",

      salt: salt,

      iterations: 310000,

      hash: "SHA-256"
    },

    keyMaterial,

    {
      name: "AES-GCM",

      length: 256
    },

    false,

    [
      "decrypt"
    ]

  );

}



async function unlockPrep() {

  const password =
    document
      .getElementById(
        "passwordInput"
      )
      .value;


  const error =
    document
      .getElementById(
        "lockError"
      );


  error.textContent = "";


  if (!password) {

    error.textContent =
      "Enter your password.";

    return;

  }


  try {

    const response =
      await fetch(
        "prep-data.json?v=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Encrypted file unavailable."
      );

    }


    const encrypted =
      await response.json();


    const salt =
      fromBase64(
        encrypted.salt
      );


    const iv =
      fromBase64(
        encrypted.iv
      );


    const ciphertext =
      fromBase64(
        encrypted.data
      );


    const key =
      await deriveKey(
        password,
        salt
      );


    const plaintext =
      await crypto.subtle.decrypt(

        {
          name: "AES-GCM",

          iv: iv
        },

        key,

        ciphertext

      );


    document
      .getElementById(
        "decryptedContent"
      )
      .innerHTML =
        decoder.decode(
          plaintext
        );


    document
      .getElementById(
        "lockScreen"
      )
      .style
      .display =
        "none";


    document
      .getElementById(
        "privateContent"
      )
      .style
      .display =
        "block";


    document
      .getElementById(
        "passwordInput"
      )
      .value =
        "";

  }

  catch(error) {

    console.error(error);


    document
      .getElementById(
        "lockError"
      )
      .textContent =
        "Wrong password or encrypted prep file unavailable.";

  }

}



function lockPrep() {

  document
    .getElementById(
      "decryptedContent"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "privateContent"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "lockScreen"
    )
    .style
    .display =
      "flex";

}



document
  .getElementById(
    "unlockButton"
  )
  .addEventListener(
    "click",
    unlockPrep
  );


document
  .getElementById(
    "passwordInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        unlockPrep();

      }

    }
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    lockPrep
  );

</script>


</body>

</html>
